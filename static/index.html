<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Agent Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #chat {
      background: #fff;
      width: 720px;
      max-width: 95vw;
      height: 82vh;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.10);
      overflow: hidden;
    }
    #header {
      padding: 14px 18px;
      border-bottom: 1px solid #e8e8e8;
      font-weight: 600;
      font-size: 15px;
      color: #111;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }
    .user  { align-self: flex-end; background: #0070f3; color: #fff; white-space: pre-wrap; }
    .agent { align-self: flex-start; background: #f4f4f4; color: #111; }
    .error { align-self: flex-start; background: #fff0f0; color: #c00; border: 1px solid #fcc; }
    .agent-label {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: #555;
      background: #dde3ec;
      border-radius: 4px;
      padding: 2px 7px;
      margin-bottom: 7px;
    }
    .agent-body { }
    .loading { padding: 14px 18px; }
    .dots { display: flex; gap: 5px; align-items: center; margin-top: 4px; }
    .dot {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1;   }
    }
    .agent table {
      border-collapse: collapse;
      margin-top: 4px;
      font-size: 13px;
    }
    .agent th, .agent td {
      border: 1px solid #ccc;
      padding: 6px 12px;
      text-align: left;
    }
    .agent th { background: #e8e8e8; font-weight: 600; }
    #status { font-size: 11px; color: #999; padding: 4px 18px; }
    #form {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #e8e8e8;
    }
    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #input:focus { border-color: #0070f3; }
    #input:disabled { background: #f9f9f9; }
    button {
      padding: 10px 20px;
      background: #0070f3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #005ecb; }
    button:disabled { background: #b0b0b0; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="header">Multi-Agent Chat</div>
    <div id="messages"></div>
    <div id="status">Connecting…</div>
    <form id="form">
      <input id="input" type="text" placeholder="Ask anything…" autocomplete="off" disabled />
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const messages = document.getElementById('messages');
    const form     = document.getElementById('form');
    const input    = document.getElementById('input');
    const send     = document.getElementById('send');
    const status   = document.getElementById('status');

    let streamBubble = null;
    let streamLabel  = null;
    let streamBody   = null;
    let streamText   = '';

    function formatAgentName(name) {
      if (!name || name === 'None') return 'Agent';
      return name.replace(/([A-Z])/g, ' $1').trim();
    }

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      if (cls === 'agent') {
        div.innerHTML = marked.parse(text);
      } else {
        div.textContent = text;
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    function setReady(ready) {
      input.disabled = !ready;
      send.disabled  = !ready;
      if (ready) input.focus();
    }

    const ws = new WebSocket(`ws://${location.host}/ws`);

    ws.onopen = () => { status.textContent = 'Connected'; setReady(true); };
    ws.onerror = () => { status.textContent = 'Connection error'; };
    ws.onclose = () => { status.textContent = 'Disconnected'; setReady(false); };

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      if (msg.type === 'start') {
        streamText = '';
        streamBubble = document.createElement('div');
        streamBubble.className = 'msg agent loading';
        streamLabel = document.createElement('div');
        streamLabel.className = 'agent-label';
        streamLabel.textContent = 'Thinking…';
        streamBody = document.createElement('div');
        streamBody.className = 'dots';
        streamBody.innerHTML =
          '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        streamBubble.appendChild(streamLabel);
        streamBubble.appendChild(streamBody);
        messages.appendChild(streamBubble);
        messages.scrollTop = messages.scrollHeight;

      } else if (msg.type === 'agent') {
        if (streamLabel) streamLabel.textContent = formatAgentName(msg.name);

      } else if (msg.type === 'chunk') {
        streamText += msg.text;
        streamBubble.classList.remove('loading');
        streamBody.className = 'agent-body';
        streamBody.innerHTML = marked.parse(streamText);
        messages.scrollTop = messages.scrollHeight;

      } else if (msg.type === 'done') {
        streamBubble = null;
        streamLabel  = null;
        streamBody   = null;
        streamText   = '';
        setReady(true);

      } else if (msg.type === 'error') {
        if (streamBubble) { streamBubble.remove(); streamBubble = null; }
        addMessage(msg.text, 'error');
        setReady(true);
      }
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      ws.send(text);
      input.value = '';
      setReady(false);
    });
  </script>
</body>
</html>
