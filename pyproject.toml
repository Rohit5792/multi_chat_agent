[project]
name = "multi-agent-chat"
version = "0.1.0"
description = "Extensible Multi-Agent chat with LangGraph and FastMCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "fastmcp>=3.2.4",
    "langchain-openai>=1.2.0",
    "langgraph>=1.1.9",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.46.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "langchain-google-genai>=4.2.2",
    "chromadb>=0.6.0",
    "docling>=2.91.0",
    "langchain-groq>=1.1.2",
    "ngrok>=1.7.0",
]



[project.scripts]
app = "app.main:main"
ingest_db = "app.data_ingest_scripts.ingest_db:main"
ingest_pdf = "app.data_ingest_scripts.ingest_pdf:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
