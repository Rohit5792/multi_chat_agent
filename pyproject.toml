[project]
name = "multi-agent-chat"
version = "0.1.0"
description = "Extensible Multi-Agent chat with LangGraph and FastMCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "fastmcp>=3.2.4",
    "langchain-openai>=1.2.0",
    "langgraph>=1.1.9",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.46.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[tool.uv]
package = true

[project.scripts]
app = "app.main:main"
ingest = "app.ingest:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
